{{- if .Values.runtimeClass.create }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  labels:
    {{- include "gvisor-deploy.labels" . | nindent 4 }}
handler: {{ .Values.runtimeHandler }}
# Schedule gVisor pods only on nodes where the installer has finished.
scheduling:
  nodeSelector:
    gvisor.dev/runsc: installed
{{- with .Values.runtimeClass.overhead }}
overhead:
  podFixed:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
